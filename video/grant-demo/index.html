<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Canvas","default":"#F4F6F0"},
    {"id":"color-deep","type":"color","label":"Deep green","default":"#0D3B22"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#0F1A12"},
    {"id":"color-accent","type":"color","label":"Lemon","default":"#C9F24C"},
    {"id":"font-display","type":"string","label":"Display font","default":"InterVideo"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "InterVideo";
        src: url("assets/fonts/Inter.ttf") format("truetype");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "GeistMonoVideo";
        src: url("assets/fonts/GeistMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "GeistMonoVideo";
        src: url("assets/fonts/GeistMono-Bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      :root {
        --canvas: #f4f6f0;
        --surface: #ffffff;
        --surface-2: #fafbf7;
        --ink: #0f1a12;
        --ink-2: #4a544c;
        --ink-3: #8a938b;
        --hairline: #e3e7dc;
        --brand: #c9f24c;
        --brand-ink: #14210f;
        --brand-deep: #0d3b22;
        --brand-soft: #eaf8c9;
        --success: #17a34a;
        --success-soft: #e6f6ec;
        --warning: #c98a00;
        --warning-soft: #fbf1da;
        --danger: #d1453b;
        --danger-soft: #fbebe9;
        --font-display: "InterVideo";
        --font-body: "InterVideo";
        --font-mono: "GeistMonoVideo";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--canvas);
      }
    </style>
  </head>
  <body>
    <div

      data-composition-id="main"
      data-start="0"
      data-duration="122"
      data-width="1920"
      data-height="1080"
